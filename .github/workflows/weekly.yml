name: weekly slips
on:
  schedule:
    - cron: "0 9 * * 5"
    - cron: "0 9 * * 2"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy
      - name: pull prices and build the slips
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python3 -m tools.weekly --out data/week.json
      - name: commit the week's data
        run: |
          git config user.name scudi-bot && git config user.email bot@scudi.local
          git add data/week.json && git commit -m "week $(date -u +%F)" || echo "nothing new"
          git push

[project]
name = "scudi-slips"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B905", "E731"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E501"]
"tests/*" = ["E501"]
